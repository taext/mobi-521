name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: mobi521
            cross: false

          - name: linux-arm64
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            binary: mobi521
            cross: true

          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: mobi521.exe
            cross: false

          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            binary: mobi521
            cross: false

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools (Linux x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross (Linux ARM64)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build with cross (Linux ARM64)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }} -p mobi521

      - name: Build native
        if: "!matrix.cross"
        run: cargo build --release --target ${{ matrix.target }} -p mobi521

      - name: Create archive (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../mobi521-${{ matrix.name }}.tar.gz ${{ matrix.binary }}

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path ${{ matrix.binary }} -DestinationPath ../../../mobi521-${{ matrix.name }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobi521-${{ matrix.name }}
          path: mobi521-${{ matrix.name }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
