[workspace]
members = [
    "crates/core",
    "crates/cli",
    "crates/wasm",
    "crates/python",
]
resolver = "2"

[workspace.package]
version = "0.6.2"
license = "MIT"

[workspace.dependencies]
# Elliptic curve / ECDH
p521            = { version = "0.13", features = ["ecdh", "arithmetic"] }
elliptic-curve  = { version = "0.13", features = ["ecdh"] }

# KDF + symmetric
hkdf            = "0.12"
sha2            = { version = "0.10", default-features = false, features = ["oid"] }
chacha20poly1305 = "0.10"

# Encoding
bech32          = "0.9"
base64ct        = { version = "1", features = ["alloc"] }

# RNG
rand            = "0.8"
rand_core       = "0.6"

# Error handling
thiserror       = "1"

# Zeroization
zeroize         = "1"
