[package]
name = "mobi521-wasm"
version = "0.22.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
mobi521-core   = { path = "../core" }
wasm-bindgen   = "0.2"
js-sys         = "0.3"
serde          = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
# Activate getrandom's JS backend for WASM builds
getrandom      = { version = "0.2", features = ["js"] }
