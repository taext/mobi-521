[package]
name = "mobi521"
version.workspace = true
edition = "2021"

[[bin]]
name = "mobi521"
path = "src/main.rs"

[features]
default = ["qr-png", "pdf", "server"]
qr-png = ["qrcode/image", "image"]
pdf = ["printpdf", "image"]
server = ["dep:axum", "dep:axum-server", "dep:tokio"]

[dependencies]
mobi521-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
arboard = "3.4"
qrcode = { version = "0.14", default-features = false }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP API server (optional)
axum = { version = "0.7", optional = true }
axum-server = { version = "0.7", features = ["tls-rustls"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }

[dependencies.image]
version = "0.25"
optional = true

[dependencies.printpdf]
version = "0.7"
optional = true

[dev-dependencies]
tower = "0.5"
